[package]
name = "hus-clean-gui"
version = "0.1.0"
edition = "2021"
description = "Interface graphique de Hus-Clean."
license = "MIT"
default-run = "hus-clean"

[[bin]]
name = "hus-clean"
path = "src/main.rs"

[dependencies]
hus-clean-core = { path = "../hus-clean-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

[build-dependencies]
embed-resource = "3"
